<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Главная</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<div class="container">
<div class="row"><!-- Основной блок для работы с колонками -->
    <div class="col-3 ">
        <div class="mh-600" style="width: 220px; height: 600px;">

        <div class="text-bg-dark p-3">
            <table style="height: 300px; table-dark; font-weight: normal">
                <div style="grid-template-columns: 1fr 1fr;" class="d-grid gap-0 row-gap-3">
                <thead>
                    <tr>
                        <th scope="col"><span class="border-bottom"></span>
                            <div class="p-2">

                                <i class="bi bi-bootstrap text-white" style="font-size: 2rem"></i><span class="ms-2" style="font-family: Arial; font-size: 25px; line-height: 2.5;">Меню</span>
                                <hr style="border: 1px solid white;">
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody><span class="border-top"></span>
                    <tr><th scope="row"><span class="border-top"></span><div class="p-2"><i class="bi bi-house-door" style="font-size: 1rem"></i><span class="ms-2">Главная</span></div></th></tr>
                    <tr><th scope="row"><div class="p-2"><i class="bi bi-boxes" style="font-size: 1rem"></i><span class="ms-2">Категории</span></div></th></tr>
                    <tr><th scope="row"><div class="p-2"><i class="bi bi-clipboard-data-fill" style="font-size: 1rem"></i><span class="ms-2">Заказы</span></div></th></tr>
                    <tr><th scope="row"><div class="p-2"><i class="bi bi-person-circle" style="font-size: 1rem"></i><span class="ms-2">Контакты</span></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                    <tr><th scope="row"><div class="p-2"></div></th></tr>
                </tbody>
                <tfoot>

                    <tr>
                        <th scope="row" >
                           <div class="align-text-bottom" >
                        <div class="dropup-center dropup"><i class="bi bi-person-circle" style="font-size: 2rem"></i><span class="ms-2"></span>
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Пользователь</button>
                            <ul class="dropdown-menu dropdown-menu-dark">
    <li><a class="dropdown-item" href="#">Выход</a></li>
    <li><a class="dropdown-item" href="#">Профиль</a></li>
</ul>
                        </div>
                           </div>
                        </th>
                    </tr>
                </tfoot>
                </div>
            </table>
        </div>
        </div>
    </div>
    <div class="col-9" >

        <table style="height: 100px;">
        <tbody>
        <tr>
            <td class="align-text-bottom"></td>
        </tr>
        </tbody>
        </table>
            <h2 class="text-center mb-3 ">Контакты</h2>
            <div class="row mt-5"> <!-- Дополнительный вложенный блок для работы с колонками -->
            <div class="col-5"> <!-- Колонка для отображения контактов -->
                <div class="card text-bg"> <!-- Карточка для визуального отделения вложенных данных -->
                    <div class="card-body"> <!-- Тело карточки, внутри которого размещаются данные -->
                        <form>
                            <h5>Имя</h5>
                            <div class="mb-3">
                                <input type="text" class="form-control" >
                            </div>
                            <h5>Почта</h5>
                            <div class="mb-3">
                                <div class="input-group has-validation">
                                <span class="input-group-text" id="inputGroupPrepend">@</span>
                                <input type="text" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
                                <div class="invalid-feedback"></div></div>
                            </div>
                            <h5>Сообщение</h5>
                            <div class="mb-3">
                                <textarea class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-40">Отправить</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-6"> <!-- -->
                <h3>Наши контакты</h3>
                <h5>Вы можете с нами связаться по телефону горячей линии.</h5>

                    </div>
                </div>
            </div>
</body>
</html>
